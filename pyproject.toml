[project]
name = "geneformer-single-cell-pipeline"
version = "0.1.0"
description = "DIMER pipeline for Geneformer V2-104M (ctheodoris/Geneformer): rank-value encoding of single-cell transcriptomes, cell embeddings, and bounded cell-state classification fine-tuning"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Kurt Valcorza" }]
dependencies = [
  "torch==2.14.0",
  "torchvision==0.29.0",
  "torchaudio==2.11.0",
  "transformers==4.57.6",
  "huggingface-hub==0.36.2",
  "safetensors==0.8.0",
  "numpy==2.5.3",
]
[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.16.6"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/geneformer_single_cell_pipeline"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["tutorials"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
